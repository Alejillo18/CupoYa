services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cupoya
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d cupoya"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 3000
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/cupoya?connection_limit=10
      REPORT_SIMULATED_WORK_MS: ${REPORT_SIMULATED_WORK_MS:-0}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata: