server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    set $backend http://backend:3000;
    proxy_pass $backend;
    proxy_connect_timeout 2s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  error_page 502 503 504 = @sin_servicio;

  location @sin_servicio {
    charset utf-8;
    default_type application/json;
    add_header Retry-After 2 always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    return 503 '{"error":{"code":"SERVICIO_NO_DISPONIBLE","message":"El servicio no está disponible. Probá de nuevo en unos segundos.","details":[]}}';
  }

  location ~* \.(?:js|css|woff2?)$ {
    expires 1y;
    try_files $uri =404;
  }

  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}