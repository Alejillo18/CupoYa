<main class="pagina pagina-angosta">
  <mat-card>
    <mat-card-content>
      <h1>CupoYa</h1>
      @if (user(); as u) {
        <p>Sesión iniciada como <strong>{{ u.email }}</strong></p>
        <p>Rol: <strong>{{ u.role }}</strong></p>
      }
      <div class="acciones">
        <a mat-flat-button routerLink="/eventos">Ver eventos</a>
        <a mat-stroked-button routerLink="/reservas">Mis reservas</a>
      </div>
    </mat-card-content>
  </mat-card>
</main>
