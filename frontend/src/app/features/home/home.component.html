<main class="auth">
  <h1>CupoYa</h1>
  @if (user(); as u) {
    <p>Sesión iniciada como <strong>{{ u.email }}</strong></p>
    <p>Rol: <strong>{{ u.role }}</strong></p>
  }
  <p><a routerLink="/eventos" class="boton">Ver eventos</a></p>
  <p><a routerLink="/reservas" class="boton secundario">Mis reservas</a></p>
  @if (esAdmin()) {
    <p><a routerLink="/usuarios" class="boton secundario">Administrar usuarios</a></p>
  }
  <button type="button" (click)="logout()">Cerrar sesión</button>
</main>
