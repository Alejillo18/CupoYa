<main class="pagina">
  <mat-card>
    <mat-card-content>
      <h1>Ingresar a CupoYa</h1>

      @if (registrado() === '1') {
        <p class="ok" role="status">Cuenta creada. Ya podés ingresar.</p>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
          <mat-error>Ingresá un email válido.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
          <mat-error>Ingresá tu contraseña.</mat-error>
        </mat-form-field>

        <button mat-flat-button type="submit" [disabled]="loading()">
          {{ loading() ? 'Ingresando…' : 'Ingresar' }}
        </button>
      </form>

      <p class="separador">o</p>
      <app-google-button />

      <p class="pie">¿No tenés cuenta? <a routerLink="/registro">Registrate</a></p>
    </mat-card-content>
  </mat-card>
</main>
