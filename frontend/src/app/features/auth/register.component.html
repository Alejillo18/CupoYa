<main class="pagina">
  <mat-card class="tarjeta">
    <mat-card-content>
      <header class="cabecera">
        <h1>Crear cuenta</h1>
        <p class="subtitulo">Registrate para reservar tu lugar en los eventos.</p>
      </header>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Email</mat-label>
          <input
            matInput
            type="email"
            formControlName="email"
            autocomplete="email"
            autocapitalize="none"
            spellcheck="false"
          />
          <mat-error>Ingresá un email válido.</mat-error>
        </mat-form-field>

        <app-password-field
          [control]="form.controls.password"
          etiqueta="Contraseña"
          autocomplete="new-password"
          error="Elegí una contraseña que cumpla los requisitos (máximo 72 caracteres)."
        />

        <ul class="requisitos" aria-label="Requisitos de la contraseña">
          @for (r of requisitos(); track r.texto) {
            <li [class.cumple]="r.cumple">
              <span class="marca" aria-hidden="true">{{ r.cumple ? '✓' : '○' }}</span>
              <span>{{ r.texto }}</span>
              <span class="solo-lectores">{{ r.cumple ? ' (cumplido)' : ' (pendiente)' }}</span>
            </li>
          }
        </ul>

        <app-password-field
          [control]="form.controls.confirm"
          etiqueta="Repetir contraseña"
          autocomplete="new-password"
          [matcher]="matcherConfirm"
          error="Las contraseñas no coinciden."
        />

        <button mat-flat-button type="submit" [disabled]="loading()" [attr.aria-busy]="loading()">
          {{ loading() ? 'Creando cuenta…' : 'Crear cuenta' }}
        </button>
      </form>

      <p class="separador"><span>o</span></p>
      <app-google-button />

      <p class="pie">¿Ya tenés cuenta? <a routerLink="/login">Ingresá</a></p>
    </mat-card-content>
  </mat-card>
</main>
