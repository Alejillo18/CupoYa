<main class="pagina">
  <mat-card>
    <mat-card-content>
      <h1>Crear cuenta</h1>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
          <mat-error>Ingresá un email válido.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="new-password" />
          <mat-hint>Mínimo 8 caracteres, con letras y números.</mat-hint>
          <mat-error>Mínimo 8 caracteres, con letras y números (máximo 72).</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Repetir contraseña</mat-label>
          <input
            matInput
            type="password"
            formControlName="confirm"
            autocomplete="new-password"
            [errorStateMatcher]="matcherConfirm"
          />
          <mat-error>Las contraseñas no coinciden.</mat-error>
        </mat-form-field>

        <button mat-flat-button type="submit" [disabled]="loading()">
          {{ loading() ? 'Creando cuenta…' : 'Crear cuenta' }}
        </button>
      </form>

      <p class="separador">o</p>
      <app-google-button />

      <p class="pie">¿Ya tenés cuenta? <a routerLink="/login">Ingresá</a></p>
    </mat-card-content>
  </mat-card>
</main>
